<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renaissance · Riset Operasional</title>
<style>
  :root {
    --bg: #F2F0EB;
    --panel: #FBFAF7;
    --surface: #FFFFFF;
    --ink: #191713;
    --body: #3A3730;
    --muted: #837C6E;
    --faint: #ACA597;
    --border: #E4E0D8;
    --border-strong: #D3CEC3;
    --accent: #DE3318;
    --accent-ink: #B42910;
    --accent-soft: rgba(222, 51, 24, 0.07);
    --accent-line: rgba(222, 51, 24, 0.22);
    --good: #4F7A54;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16150F;
      --panel: #1E1C15;
      --surface: #232019;
      --ink: #F3F0E8;
      --body: #D7D2C6;
      --muted: #948D7E;
      --faint: #6E685B;
      --border: #322E24;
      --border-strong: #423D30;
      --accent: #F26A4C;
      --accent-ink: #F58467;
      --accent-soft: rgba(242, 106, 76, 0.10);
      --accent-line: rgba(242, 106, 76, 0.30);
      --good: #7FA982;
    }
  }
  :root[data-theme="light"] {
    --bg:#F2F0EB;--panel:#FBFAF7;--surface:#FFFFFF;--ink:#191713;--body:#3A3730;--muted:#837C6E;--faint:#ACA597;
    --border:#E4E0D8;--border-strong:#D3CEC3;--accent:#DE3318;--accent-ink:#B42910;--accent-soft:rgba(222,51,24,.07);
    --accent-line:rgba(222,51,24,.22);--good:#4F7A54;
  }
  :root[data-theme="dark"] {
    --bg:#16150F;--panel:#1E1C15;--surface:#232019;--ink:#F3F0E8;--body:#D7D2C6;--muted:#948D7E;--faint:#6E685B;
    --border:#322E24;--border-strong:#423D30;--accent:#F26A4C;--accent-ink:#F58467;--accent-soft:rgba(242,106,76,.10);
    --accent-line:rgba(242,106,76,.30);--good:#7FA982;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--body);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.55; letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-columns: 300px minmax(0,1fr); min-height: 100dvh; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } }

  /* Rail */
  .rail {
    background: var(--panel); border-right: 1px solid var(--border);
    padding: 34px 30px; display: flex; flex-direction: column; gap: 30px;
    position: sticky; top: 0; height: 100dvh;
  }
  @media (max-width: 820px) { .rail { position: static; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding: 16px 18px; gap: 14px; } }
  .rail-brand { display: flex; align-items: center; gap: 12px; }
  .rail-brand .bt { display: flex; flex-direction: column; line-height: 1.2; }
  .rail-brand .bt b { color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .rail-brand .bt span { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }

  .rail-title { color: var(--ink); font-size: 21px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; text-wrap: balance; }
  .rail-sub { color: var(--muted); font-size: 12.5px; margin-top: -18px; }
  @media (max-width: 820px) { .rail-title, .rail-sub, .steps { display: none; } }

  .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
  .steps li { display: flex; align-items: center; gap: 11px; padding: 7px 0; font-size: 12.5px; color: var(--faint); transition: color .2s; }
  .steps li .num {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border-strong);
    display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--faint);
    flex: none; font-variant-numeric: tabular-nums;
  }
  .steps li.done { color: var(--muted); }
  .steps li.done .num { border-color: var(--good); color: var(--good); }
  .steps li.active { color: var(--ink); font-weight: 500; }
  .steps li.active .num { border-color: var(--accent); background: var(--accent); color: #fff; }

  .rail-progress { display: none; }
  @media (max-width: 820px) {
    .steps { display: none; }
    .rail-progress { display: block; flex: 1; }
    .rail-progress .bar { height: 4px; border-radius: 3px; background: var(--border); overflow: hidden; }
    .rail-progress .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .35s ease-out; }
    .rail-progress .lbl { font-size: 11px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  }

  /* Stage */
  .stage { padding: 56px 8vw 96px; display: flex; justify-content: center; }
  @media (max-width: 820px) { .stage { padding: 28px 20px 72px; } }
  .step { width: 100%; max-width: 680px; }
  .step[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .step { animation: rise .34s cubic-bezier(.2,.7,.3,1); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .spin { animation: sp 1s linear infinite; transform-origin: center; }
    @keyframes sp { to { transform: rotate(360deg); } }
  }

  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  h1.q { margin: 0; color: var(--ink); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; text-wrap: balance; }
  h2.q { margin: 0; color: var(--ink); font-size: 24px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.12; text-wrap: balance; }
  .lede { margin: 14px 0 0; color: var(--body); font-size: 15.5px; max-width: 54ch; }

  /* Welcome / segment cards */
  .seg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 32px; }
  .seg {
    text-align: left; cursor: pointer; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; transition: border-color .18s, transform .18s, background .18s;
    color: var(--body); font: inherit;
  }
  .seg:hover, .seg:focus-visible { border-color: var(--border-strong); transform: translateY(-2px); }
  .seg[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .seg .ic { width: 30px; height: 30px; color: var(--accent); }
  .seg .ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .seg b { color: var(--ink); font-size: 15px; letter-spacing: -0.015em; }
  .seg span { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
  .welcome-meta { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }
  .welcome-meta div { display: flex; flex-direction: column; }
  .welcome-meta b { color: var(--ink); font-size: 19px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .welcome-meta span { color: var(--muted); font-size: 11.5px; letter-spacing: 0.03em; text-transform: uppercase; }

  /* Fields */
  .fields { margin-top: 30px; display: flex; flex-direction: column; gap: 26px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  legend { padding: 0; color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: -0.012em; line-height: 1.35; }
  legend .req { color: var(--accent); font-weight: 700; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .rolehead { padding-top: 8px; border-top: 1px solid var(--border); }
  .rolehead .eyebrow { margin-bottom: 6px; }
  .rolehead .hint { margin-top: 0; }
  .fieldset-body { margin-top: 12px; }

  input[type=text], input[type=tel], input[type=email], input[type=number], textarea {
    width: 100%; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border-strong); border-radius: 9px; padding: 11px 13px;
    font: inherit; font-size: 15px; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  .other-wrap { margin-top: 12px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { resize: vertical; min-height: 92px; line-height: 1.5; }
  .prefix-wrap { position: relative; }
  .prefix-wrap .pfx { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; font-weight: 500; pointer-events: none; }
  .prefix-wrap input { padding-left: 34px; font-variant-numeric: tabular-nums; }

  .opts { display: flex; flex-direction: column; gap: 0; }
  .opts.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); column-gap: 26px; }
  .opt {
    position: relative; display: flex; align-items: flex-start; gap: 12px; cursor: pointer;
    background: transparent; border: 0; border-bottom: 1px solid var(--border); border-radius: 0;
    padding: 13px 0; font-size: 14px; color: var(--body); transition: color .15s, border-color .15s;
  }
  .opt:hover { border-bottom-color: var(--border-strong); color: var(--ink); }
  .opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .opt .mark { width: 18px; height: 18px; margin-top: 1px; border: 1.5px solid var(--border-strong); border-radius: 50%; flex: none; display: grid; place-items: center; transition: border-color .15s; }
  .opt .mark.sq { border-radius: 5px; }
  .opt .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .15s; }
  .opt .mark.sq::after { border-radius: 2px; }
  .opt:has(input:checked) { border-bottom-color: var(--accent); color: var(--ink); font-weight: 500; }
  .opt:has(input:checked) .mark { border-color: var(--accent); }
  .opt:has(input:checked) .mark::after { transform: scale(1); }
  .opt:has(input:focus-visible) .mark { box-shadow: 0 0 0 3px var(--accent-soft); }

  /* Scale */
  .scale { display: flex; gap: 6px; flex-wrap: wrap; }
  .scale label { cursor: pointer; }
  .scale input { position: absolute; opacity: 0; }
  .scale .pip {
    width: 40px; height: 44px; border: 1px solid var(--border-strong); border-radius: 8px;
    display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--muted);
    font-variant-numeric: tabular-nums; transition: all .13s;
  }
  .scale label:hover .pip { border-color: var(--accent-line); }
  .scale input:checked + .pip { background: var(--accent); border-color: var(--accent); color: #fff; }
  .scale input:focus-visible + .pip { box-shadow: 0 0 0 3px var(--accent-soft); }
  .scale-ends { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
  @media (max-width: 520px) { .scale .pip { width: 30px; height: 40px; font-size: 13px; } }

  /* Grid */
  .grid-scroll { overflow-x: auto; }
  .grid-tbl { min-width: 380px; }
  .grid-row { display: grid; align-items: stretch; gap: 8px; padding: 9px 0; border-top: 1px solid var(--border); }
  .grid-row.head { border-top: 0; padding-bottom: 4px; }
  .grid-row .rlabel { font-size: 13.5px; color: var(--body); align-self: center; padding-right: 6px; }
  .grid-row.head .rlabel { color: transparent; }
  .grid-cells { display: grid; gap: 6px; grid-column: 2 / -1; }
  .grid-head-cell { font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); text-align: center; align-self: end; line-height: 1.2; }
  .gcell { cursor: pointer; }
  .gcell input { position: absolute; opacity: 0; }
  .gcell .dot { height: 34px; border: 1px solid var(--border-strong); border-radius: 7px; display: grid; place-items: center; transition: all .13s; }
  .gcell .dot::after { content:""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .13s; }
  .gcell:hover .dot { border-color: var(--accent-line); }
  .gcell input:checked + .dot { border-color: var(--accent); background: var(--accent-soft); }
  .gcell input:checked + .dot::after { transform: scale(1); }
  .gcell input:focus-visible + .dot { box-shadow: 0 0 0 3px var(--accent-soft); }
  .gcell .clab { display: none; }

  /* Grid → kartu-per-baris di layar HP */
  @media (max-width: 600px) {
    .grid-scroll { overflow: visible; }
    .grid-tbl { min-width: 0; }
    .grid-row.head { display: none; }
    .grid-row { display: block; padding: 16px 0; }
    .grid-row .rlabel { padding: 0 0 11px; font-size: 14px; line-height: 1.4; }
    .grid-row .grid-cells { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
    .gcell .dot { display: none; }
    .gcell .clab {
      display: flex; align-items: center; gap: 9px; padding: 12px 13px;
      border: 1px solid var(--border-strong); border-radius: 9px;
      font-size: 13.5px; color: var(--body); transition: border-color .13s, background .13s; min-height: 46px;
    }
    .gcell .clab::before { content: ""; width: 17px; height: 17px; border: 1.5px solid var(--border-strong); border-radius: 50%; flex: none; transition: border-color .13s; }
    .gcell input:checked ~ .clab { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
    .gcell input:checked ~ .clab::before { border-color: var(--accent); box-shadow: inset 0 0 0 3.5px var(--surface), inset 0 0 0 9px var(--accent); }
    .gcell input:focus-visible ~ .clab { box-shadow: 0 0 0 3px var(--accent-soft); }
  }

  /* Skala dampak — blok, tanpa angka */
  .opt.blk { gap: 14px; align-items: center; }
  .blks { display: flex; gap: 3px; flex: none; }
  .blks .sq { width: 8px; height: 20px; border-radius: 2px; background: var(--border-strong); display: block; transition: background .15s; }
  .blks .sq.on { background: var(--accent-line); }
  .opt.blk:has(input:checked) .blks .sq.on { background: var(--accent); }
  .blbl { line-height: 1.35; }

  .pick-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .pick-note.warn { color: var(--accent-ink); font-weight: 500; }

  .err { color: var(--accent-ink); font-size: 12.5px; margin-top: 8px; display: none; }
  .err.on { display: block; }

  /* Nav */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--border); }
  .btn {
    font: inherit; font-size: 14.5px; font-weight: 600; cursor: pointer; border-radius: 9px;
    padding: 12px 22px; border: 1px solid transparent; transition: background .15s, border-color .15s, transform .1s, opacity .15s;
    display: inline-flex; align-items: center; gap: 9px;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-ink); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--border-strong); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--faint); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Success */
  .done-wrap { text-align: center; padding-top: 24px; }
  .done-ic { width: 66px; height: 66px; margin: 0 auto 22px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; }
  .done-ic svg { width: 30px; height: 30px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .demo-banner {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 12px; padding: 8px 16px; border-radius: 999px;
    z-index: 20; opacity: .92;
  }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="rail-brand">
      <span class="bt"><b>Renaissance</b><span>Riset operasional</span></span>
    </div>
    <div class="rail-title">Sistem untuk menjalankan studio desain, vendor &amp; kontraktor</div>
    <p class="rail-sub">8–10 menit · jawaban Anda menentukan fitur yang kami prioritaskan.</p>
    <ol class="steps" id="stepList"></ol>
    <div class="rail-progress"><div class="bar"><i id="mbar" style="width:0%"></i></div><div class="lbl" id="mlbl">Mulai</div></div>

  <main class="stage">
    <div id="steproot"></div>

</div>

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const arrow = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function welcome() {
  const cards = SEGMENTS.map(s => '<button type="button" class="seg" data-seg="'+s.id+'" aria-pressed="false"><span class="ic">'+IC[s.id]+'</span><b>'+s.label+'</b><span>'+s.tag+'</span></button>').join('');
  root.innerHTML =
    '<section class="step">'+
      '<h1 class="q">Renaissance</h1>'+
      '<p class="lede">Gue lagi bangun startup namanya “Renaissance” — sistem buat bantu temen temen desainer untuk urusan operasional kantor (material library vendor, timeline project, assignment pic desain dll).</p>'+
      '<p class="lede">Sebelum gue lanjut, gue butuh masukan dari temen temen, supaya sistemnya sesuai kebutuhan temen temen, <b>gue mau minta tolong dong buat isi questionnaire singkat 5 menit!!</b></p>'+
      '<div class="seg-grid">'+cards+'</div>'+
      '<div class="welcome-meta"><div><b>±5 menit</b><span>8 bagian</span></div><div><b>Menyesuaikan</b><span>per jenis usaha</span></div><div><b>Tanpa benar/salah</b><span>sesuai kondisi Anda</span></div></div>'+
      '<div class="nav" style="border:0;padding:0;margin-top:26px;justify-content:flex-end"><button type="button" class="btn primary" id="startBtn" disabled>Mulai '+arrow+'</button></div>'+
    '</section>';
  root.querySelectorAll('.seg').forEach(b => b.addEventListener('click', () => {
    state.segment = b.dataset.seg;
    root.querySelectorAll('.seg').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    document.getElementById('startBtn').disabled = false;
  }));
  document.getElementById('startBtn').addEventListener('click', () => {
    if (!state.segment) return;
    STEPS = buildSteps(state.segment); state.step = 0; state.answers = {}; renderStep();
  });
  buildRail();
}

function buildRail() {
  const list = document.getElementById('stepList');
  if (!STEPS.length) { list.innerHTML = ''; document.getElementById('mbar').style.width='0%'; document.getElementById('mlbl').textContent='Mulai'; return; }
  list.innerHTML = STEPS.map((s,i) => {
    const cls = i < state.step ? 'done' : i === state.step ? 'active' : '';
    const mark = i < state.step ? '✓' : (i+1);
    return '<li class="'+cls+'"><span class="num">'+mark+'</span>'+esc(valOf(s.key))+'</li>';
  }).join('');
  const pct = Math.round(state.step / STEPS.length * 100);
  document.getElementById('mbar').style.width = pct + '%';
  document.getElementById('mlbl').textContent = 'Bagian ' + (state.step+1) + ' dari ' + STEPS.length;
}

function valOf(v) { return typeof v === 'function' ? v(state.answers) : v; }
function fieldsOf(s) { return valOf(s.fields) || []; }

function field(f) {
  if (f.t === 'note') return '<div class="rolehead"><div class="eyebrow">'+esc(f.eyebrow||'')+'</div><p class="hint">'+esc(f.label)+'</p></div>';
  const req = f.req ? ' <span class="req">*</span>' : '';
  let body = '';
  if (f.t === 'text' || f.t === 'tel' || f.t === 'email' || f.t === 'number') {
    const v = esc(state.answers[f.k] || '');
    const ph = f.t==='tel'?'08xx xxxx xxxx':f.t==='email'?'nama@usaha.com':'Ketik di sini…';
    body = '<input type="'+f.t+'" data-k="'+f.k+'" value="'+v+'" placeholder="'+ph+'">';
  } else if (f.t === 'rupiah') {
    const v = esc(state.answers[f.k] || '');
    body = '<div class="prefix-wrap"><span class="pfx">Rp</span><input type="text" inputmode="numeric" data-k="'+f.k+'" data-rupiah="1" value="'+v+'" placeholder="500.000"></div>';
  } else if (f.t === 'textarea') {
    const v = esc(state.answers[f.k] || '');
    body = '<textarea data-k="'+f.k+'" placeholder="Tulis di sini…">'+v+'</textarea>';
  } else if (f.t === 'radio') {
    const useCols = f.opts.length>3 && f.opts.every(o=>o.length<22);
    body = '<div class="opts'+(useCols?' cols':'')+'">' + f.opts.map(o => {
      const ck = state.answers[f.k]===o ? 'checked':'';
      return '<label class="opt"><input type="radio" name="'+f.k+'" value="'+esc(o)+'" '+ck+'><span class="mark"></span>'+esc(o)+'</label>';
    }).join('') + '</div>';
    if (f.other) {
      const ov = esc(state.answers[f.k+'_lain'] || '');
      const show = state.answers[f.k] === f.other;
      body += '<div class="other-wrap" data-otherwrap="'+f.k+'" data-show="'+esc(f.other)+'"'+(show?'':' style="display:none"')+'><input type="text" data-otherk="'+f.k+'_lain" value="'+ov+'" placeholder="Sebutkan…"></div>';
    }
  } else if (f.t === 'checkbox') {
    const cur = state.answers[f.k] || [];
    const maxNote = f.max ? '<div class="pick-note" data-max="'+f.max+'" data-k="'+f.k+'">Pilih maksimal '+f.max+' — <span class="cnt">'+cur.length+'</span>/'+f.max+'</div>' : '';
    body = '<div class="opts">' + f.opts.map(o => {
      const ck = cur.includes(o) ? 'checked':'';
      return '<label class="opt"><input type="checkbox" name="'+f.k+'" value="'+esc(o)+'" '+ck+'><span class="mark sq"></span>'+esc(o)+'</label>';
    }).join('') + '</div>' + maxNote;
  } else if (f.t === 'blocks') {
    body = '<div class="opts">' + f.opts.map(function(o, i){
      var sq = '';
      for (var b = 0; b < f.opts.length; b++) sq += '<i class="sq'+(b<=i?' on':'')+'"></i>';
      var ck = state.answers[f.k] === String(i+1) ? 'checked':'';
      return '<label class="opt blk"><input type="radio" name="'+f.k+'" value="'+(i+1)+'" '+ck+'><span class="blks">'+sq+'</span><span class="blbl">'+esc(o)+'</span></label>';
    }).join('') + '</div>';
  } else if (f.t === 'scale') {
    let pips = '';
    for (let i=f.min;i<=f.max;i++){ const ck = String(state.answers[f.k])===String(i)?'checked':''; pips += '<label><input type="radio" name="'+f.k+'" value="'+i+'" '+ck+'><span class="pip">'+i+'</span></label>'; }
    body = '<div class="scale">'+pips+'</div><div class="scale-ends"><span>'+f.lo+'</span><span>'+f.hi+'</span></div>';
  } else if (f.t === 'grid') {
    const cur = state.answers[f.k] || {};
    const cols = f.cols;
    const gt = 'grid-template-columns: minmax(120px,1.6fr) repeat('+cols.length+', minmax(56px,1fr));';
    const gc = 'grid-template-columns:repeat('+cols.length+',1fr)';
    let head = '<div class="grid-row head" style="'+gt+'"><div class="rlabel">.</div><div class="grid-cells" style="'+gc+'">' + cols.map(c=>'<div class="grid-head-cell">'+esc(c)+'</div>').join('') + '</div></div>';
    let rows = f.rows.map((r,ri) => {
      const cells = cols.map(c => {
        const ck = cur[r]===c ? 'checked':'';
        return '<label class="gcell"><input type="radio" name="'+f.k+'__'+ri+'" value="'+esc(c)+'" data-row="'+esc(r)+'" '+ck+'><span class="dot"></span><span class="clab">'+esc(c)+'</span></label>';
      }).join('');
      return '<div class="grid-row" style="'+gt+'"><div class="rlabel">'+esc(r)+'</div><div class="grid-cells" style="'+gc+'">'+cells+'</div></div>';
    }).join('');
    body = '<div class="grid-scroll"><div class="grid-tbl">'+head+rows+'</div></div>';
  }
  const hint = f.hint ? '<div class="hint">'+esc(f.hint)+'</div>' : '';
  return '<fieldset data-fk="'+f.k+'" data-ft="'+f.t+'"><legend>'+esc(f.label)+req+'</legend>'+hint+'<div class="fieldset-body">'+body+'</div><div class="err" id="err_'+f.k+'">Wajib diisi.</div></fieldset>';
}

function renderStep() {
  if (state.step >= STEPS.length) return submit();
  const s = STEPS[state.step];
  const nt = valOf(s.note);
  const note = nt ? '<p class="lede">'+esc(nt)+'</p>' : '';
  const last = state.step === STEPS.length - 1;
  root.innerHTML =
    '<section class="step">'+
      '<div class="eyebrow">'+esc(valOf(s.eyebrow))+'</div>'+
      '<h2 class="q">'+esc(valOf(s.title))+'</h2>'+note+
      '<div class="fields">'+fieldsOf(s).map(field).join('')+'</div>'+
      '<div class="nav">'+
        '<button type="button" class="btn ghost" id="back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> Kembali</button>'+
        '<button type="button" class="btn primary" id="next">'+(last?'Kirim jawaban':'Lanjut '+arrow)+'</button>'+
      '</div>'+
    '</section>';
  wireInputs();
  document.getElementById('back').addEventListener('click', () => { collect(); if(state.step===0){ STEPS=[]; welcome(); return;} state.step--; renderStep(); buildRail(); window.scrollTo(0,0); });
  document.getElementById('next').addEventListener('click', () => {
    collect();
    if (!validate(s)) return;
    state.step++;
    if (state.step >= STEPS.length) submit(); else { renderStep(); }
    buildRail(); window.scrollTo(0,0);
  });
  buildRail(); window.scrollTo(0,0);
}

function wireInputs() {
  root.querySelectorAll('input[data-rupiah]').forEach(inp => {
    inp.addEventListener('input', () => {
      const d = inp.value.replace(/\D/g,'');
      inp.value = d ? Number(d).toLocaleString('id-ID') : '';
    });
  });
  root.querySelectorAll('[data-otherwrap]').forEach(w => {
    const k = w.dataset.otherwrap, trig = w.dataset.show;
    root.querySelectorAll('input[name="'+k+'"]').forEach(r => r.addEventListener('change', () => {
      const sel = root.querySelector('input[name="'+k+'"]:checked');
      const on = !!sel && sel.value === trig;
      w.style.display = on ? '' : 'none';
      if (on) w.querySelector('input').focus();
    }));
  });
  root.querySelectorAll('.pick-note[data-max]').forEach(note => {
    const k = note.dataset.k, max = +note.dataset.max;
    const boxes = () => Array.from(root.querySelectorAll('input[name="'+k+'"]'));
    const upd = () => {
      const n = boxes().filter(b=>b.checked).length;
      note.querySelector('.cnt').textContent = n;
      note.classList.toggle('warn', n>=max);
      boxes().forEach(b => { b.disabled = (!b.checked && n>=max); b.closest('.opt').style.opacity = b.disabled?'.5':''; });
    };
    boxes().forEach(b => b.addEventListener('change', upd)); upd();
  });
}

function collect() {
  root.querySelectorAll('fieldset').forEach(fs => {
    const k = fs.dataset.fk, t = fs.dataset.ft;
    if (['text','tel','email','number','rupiah','textarea'].includes(t)) {
      const el = fs.querySelector('[data-k]'); if (el) state.answers[k] = el.value.trim();
    } else if (t === 'radio' || t === 'scale' || t === 'blocks') {
      const el = fs.querySelector('input[name="'+k+'"]:checked'); if (el) state.answers[k] = el.value;
    } else if (t === 'checkbox') {
      state.answers[k] = Array.from(fs.querySelectorAll('input[name="'+k+'"]:checked')).map(e=>e.value);
    } else if (t === 'grid') {
      const cur = {};
      fs.querySelectorAll('input:checked').forEach(e => cur[e.dataset.row] = e.value);
      state.answers[k] = cur;
    }
  });
  root.querySelectorAll('input[data-otherk]').forEach(el => { state.answers[el.dataset.otherk] = el.value.trim(); });
}

function validate(s) {
  let ok = true, firstBad = null;
  fieldsOf(s).forEach(f => {
    const errEl = document.getElementById('err_'+f.k);
    if (errEl) errEl.classList.remove('on');
    if (!f.req) return;
    const v = state.answers[f.k];
    let bad = false, msg = 'Wajib diisi.';
    if (f.t === 'grid') { bad = !v || Object.keys(v).length < f.rows.length; msg = 'Lengkapi semua baris.'; }
    else if (f.t === 'checkbox') bad = !v || v.length === 0;
    else bad = !v || (typeof v === 'string' && !v.trim());
    if (!bad && f.other && v === f.other && !(state.answers[f.k+'_lain']||'').trim()) { bad = true; msg = 'Mohon disebutkan.'; }
    if (bad) { ok = false; if (errEl){ errEl.textContent = msg; errEl.classList.add('on'); } if (!firstBad) firstBad = errEl; }
  });
  if (firstBad) firstBad.closest('fieldset').scrollIntoView({ behavior:'smooth', block:'center' });
  return ok;
}

/* ===================== SUBMIT ===================== */
/* Penanda versi halaman — ikut terkirim tiap jawaban, supaya selalu jelas
   responden mengisi versi form yang mana. Naikkan huruf tiap rilis. */
var FORM_VERSION = '2026-08-01-b';
var SB_URL = 'https://qygovbenwcmuxmsoejxg.supabase.co/rest/v1/pmf_responses';
var SB_KEY = 'sb_publishable_fIuFpBRNVroxJvrRywJQkQ_GLELKQsw';

function payload() {
  return { segment: state.segment, segmentLabel: SEGMENTS.find(function(s){return s.id===state.segment;}).label, answers: state.answers };
}

function submit() {
  var p = payload();
  var a = p.answers || {};
  var L = function(v){ return Array.isArray(v) ? v : (v ? [v] : []); };
  var S = function(v){ return v == null ? '' : String(v); };
  var row = {
    segment: p.segment, segment_label: p.segmentLabel,
    nama: S(a.nama), perusahaan: S(a.perusahaan),
    posisi: S(a.posisi === 'Lainnya' && a.posisi_lain ? 'Lainnya: ' + a.posisi_lain : a.posisi),
    peran: S(a.peran),
    lama: S(a.lama), tim: S(a.tim), proyekbln: S(a.proyekbln), nilaiproyek: S(a.nilaiproyek),
    tooling: L(a.tooling), lamapenawaran: S(a.lamapenawaran), siapabikin: S(a.siapabikin),
    caraharga: L(a.caraharga), lakudiam: S(a.lakudiam),
    freq: a.freq || {}, palingrugi: L(a.palingrugi), kerugian: S(a.kerugian), severity: S(a.severity),
    ceritamasalah: S(a.ceritamasalah), sudahcoba: S(a.sudahcoba),
    usefulness: a.usefulness || {}, top3: L(a.top3), ai: L(a.ai),
    model: S(a.model), harga_bln: S(a.harga_bln), harga_thn: S(a.harga_thn),
    pemutus: S(a.pemutus), hambatan: L(a.hambatan), kapan: S(a.kapan),
    pilot: S(a.pilot), wa: S(a.wa), email: S(a.email), referral: S(a.referral),
    v_sales_volume: S(a.v_sales_volume), v_sales_lacak: L(a.v_sales_lacak),
    v_sales_hilang: S(a.v_sales_hilang), v_sales_stok: S(a.v_sales_stok),
    v_sales_diskon: S(a.v_sales_diskon), v_sales_komisi: S(a.v_sales_komisi),
    v_own_visibilitas: S(a.v_own_visibilitas), v_own_tutupbuku: S(a.v_own_tutupbuku),
    v_own_kontrol: L(a.v_own_kontrol), v_own_margin: S(a.v_own_margin),
    v_own_pengganti: S(a.v_own_pengganti), v_own_spend: S(a.v_own_spend),
    v_sales_menang: S(a.v_sales_menang), v_sales_dorong: S(a.v_sales_dorong),
    v_sales_pengaruh: S(a.v_sales_pengaruh), v_sales_tolak: L(a.v_sales_tolak),
    v_sales_mobile: S(a.v_sales_mobile),
    form_version: FORM_VERSION,
    raw: p
  };
  renderSending();
  fetch(SB_URL, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY,
               'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
    body: JSON.stringify(row)
  }).then(function(r){
    if (!r.ok) return r.text().then(function(t){ throw new Error('HTTP ' + r.status + ' — ' + t.slice(0,140)); });
    renderDone();
  }).catch(function(e){
    renderDone(String((e && e.message) || e));
  });
}

function renderSending() {
  root.innerHTML = '<section class="step done-wrap"><div class="done-ic"><svg viewBox="0 0 24 24" class="spin"><path d="M21 12a9 9 0 1 1-6.2-8.5"/></svg></div><h2 class="q">Mengirim\u2026</h2></section>';
}

function renderDone(errMsg) {
  document.getElementById('stepList').innerHTML = '';
  document.getElementById('mbar').style.width = '100%';
  document.getElementById('mlbl').textContent = errMsg ? 'Gagal terkirim' : 'Selesai';
  if (errMsg) {
    root.innerHTML =
      '<section class="step done-wrap">'+
        '<h2 class="q">Jawaban belum terkirim</h2>'+
        '<p class="lede" style="margin-left:auto;margin-right:auto">Koneksi ke server tidak berhasil, sehingga jawaban Anda <b>belum tersimpan</b>. Silakan periksa koneksi lalu kirim ulang \u2014 isian Anda masih tersimpan di halaman ini.</p>'+
        '<p class="hint">Detail teknis: '+esc(errMsg)+'</p>'+
        '<div class="nav" style="border:0;justify-content:center;margin-top:26px"><button type="button" class="btn primary" id="retry">Kirim ulang</button></div>'+
      '</section>';
    document.getElementById('retry').addEventListener('click', submit);
    return;
  }
  root.innerHTML =
    '<section class="step done-wrap">'+
      '<div class="done-ic"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>'+
      '<h2 class="q">Terima kasih banyak!</h2>'+
      '<p class="lede" style="margin-left:auto;margin-right:auto">Jawaban Anda telah tersimpan dan akan langsung memengaruhi fitur yang kami prioritaskan. Jika Anda mencantumkan nomor WhatsApp, tim kami akan menghubungi Anda.</p>'+
    '</section>';
}

welcome();

/* QA / deep-link: ?seg=<id>&step=<n> lompat ke bagian tertentu buat preview */
(function(){
  var q = new URLSearchParams(location.search);
  var seg = q.get('seg');
  if (seg && PROBLEMS[seg]) {
    state.segment = seg; STEPS = buildSteps(seg);
    state.answers = { nama:'—', perusahaan:'—' };
    if (q.get('posisi')) state.answers.posisi = q.get('posisi');
    state.step = Math.max(0, Math.min(parseInt(q.get('step')||'2',10), STEPS.length-1));
    renderStep(); buildRail();
  }
})();
</script>
